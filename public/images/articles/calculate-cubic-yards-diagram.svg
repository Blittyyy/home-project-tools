<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Cubic yards calculation diagram</title>
  <desc id="desc">Length times width times thickness equals cubic feet; divide by 27 to get cubic yards.</desc>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="36" y="36" width="1128" height="603" fill="#FFFFFF" stroke="#D8D5CE" stroke-width="2"/>

  <text x="72" y="92" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1F6A43">RECTANGULAR VOLUME</text>

  <polygon points="220,420 420,420 500,340 300,340" fill="#E7F1EA" stroke="#191919" stroke-width="2.5"/>
  <polygon points="420,420 500,340 500,220 420,300" fill="#D8E8DE" stroke="#191919" stroke-width="2.5"/>
  <polygon points="220,420 300,340 300,220 220,300" fill="#F6EBE6" stroke="#191919" stroke-width="2.5"/>
  <polygon points="220,300 420,300 500,220 300,220" fill="#FFFFFF" stroke="#191919" stroke-width="2.5"/>

  <text x="320" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F6A43">LENGTH</text>
  <text x="175" y="370" text-anchor="middle" transform="rotate(-90 175 370)" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F6A43">WIDTH</text>
  <text x="470" y="270" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#A94B2B">THICKNESS</text>
  <text x="320" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#686862">Convert thickness to feet first</text>

  <text x="620" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1F6A43">FORMULA</text>

  <rect x="620" y="180" width="480" height="64" fill="#FAF8F3" stroke="#191919" stroke-width="2"/>
  <text x="860" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#191919">LENGTH x WIDTH x THICKNESS</text>

  <line x1="860" y1="244" x2="860" y2="280" stroke="#A94B2B" stroke-width="3"/>
  <polygon points="860,292 852,278 868,278" fill="#A94B2B"/>

  <rect x="680" y="300" width="360" height="56" fill="#E7F1EA" stroke="#191919" stroke-width="2"/>
  <text x="860" y="336" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1F6A43">CUBIC FEET</text>

  <line x1="860" y1="356" x2="860" y2="392" stroke="#A94B2B" stroke-width="3"/>
  <polygon points="860,404 852,390 868,390" fill="#A94B2B"/>

  <rect x="720" y="412" width="280" height="48" fill="#FFFFFF" stroke="#D8D5CE" stroke-width="2"/>
  <text x="860" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#191919">/ 27</text>

  <line x1="860" y1="460" x2="860" y2="496" stroke="#A94B2B" stroke-width="3"/>
  <polygon points="860,508 852,494 868,494" fill="#A94B2B"/>

  <rect x="680" y="516" width="360" height="56" fill="#191919" stroke="#191919" stroke-width="2"/>
  <text x="860" y="552" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">CUBIC YARDS</text>

  <text x="860" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#686862">1 cubic yard = 27 cubic feet</text>
</svg>
