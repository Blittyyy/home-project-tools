<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">12 by 12 room paint estimate diagram</title>
  <desc id="desc">12 by 12 foot room with 8 foot walls equals 384 square feet of wall. At 350 square feet per gallon, one coat is about 1.10 gallons and two coats about 2.19 gallons.</desc>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="36" y="36" width="1128" height="603" fill="#FFFFFF" stroke="#D8D5CE" stroke-width="2"/>

  <text x="72" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1F6A43">12 x 12 ROOM EXAMPLE</text>
  <text x="72" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#686862">Example using 350 sq ft/gal</text>

  <!-- Room box front elevation style -->
  <rect x="100" y="180" width="380" height="320" fill="#E7F1EA" stroke="#191919" stroke-width="3"/>

  <!-- Width label top -->
  <line x1="100" y1="160" x2="480" y2="160" stroke="#191919" stroke-width="1.5"/>
  <line x1="100" y1="152" x2="100" y2="168" stroke="#191919" stroke-width="1.5"/>
  <line x1="480" y1="152" x2="480" y2="168" stroke="#191919" stroke-width="1.5"/>
  <text x="290" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1F6A43">12 ft</text>

  <!-- Depth label -->
  <text x="290" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#191919">12 x 12 ft</text>
  <text x="290" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#686862">footprint</text>

  <!-- Height -->
  <line x1="510" y1="180" x2="510" y2="500" stroke="#A94B2B" stroke-width="2"/>
  <line x1="502" y1="180" x2="518" y2="180" stroke="#A94B2B" stroke-width="2"/>
  <line x1="502" y1="500" x2="518" y2="500" stroke="#A94B2B" stroke-width="2"/>
  <text x="535" y="350" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#A94B2B">8 ft</text>
  <text x="535" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#686862">walls</text>

  <!-- Formula result -->
  <rect x="100" y="540" width="460" height="56" fill="#191919"/>
  <text x="330" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2 x (12 + 12) x 8 = 384 sq ft</text>

  <!-- Coat comparison -->
  <text x="700" y="88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#1F6A43">COAT COMPARISON</text>
  <text x="700" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#686862">At 350 sq ft/gal, no openings</text>

  <rect x="700" y="160" width="420" height="160" fill="#FAF8F3" stroke="#191919" stroke-width="2"/>
  <text x="720" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1F6A43">1 COAT</text>
  <text x="720" y="240" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#191919">384 / 350 = ~1.10 gal</text>
  <text x="720" y="280" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#A94B2B">Buy 2 whole gallons</text>

  <rect x="700" y="360" width="420" height="160" fill="#E7F1EA" stroke="#191919" stroke-width="2"/>
  <text x="720" y="400" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1F6A43">2 COATS</text>
  <text x="720" y="440" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#191919">768 / 350 = ~2.19 gal</text>
  <text x="720" y="480" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#A94B2B">Buy 3 whole gallons</text>

  <text x="910" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#686862">Wall height and coats change the result</text>
</svg>
